services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: logs_dashboard
      POSTGRES_USER: logs
      POSTGRES_PASSWORD: logs
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logs -d logs_dashboard"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://logs:logs@db:5432/logs_dashboard
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
